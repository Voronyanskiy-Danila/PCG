# Настройки UV / тайлинга (UTF-8).
#
# Файл читается из каталога content рядом с .exe (например bin\x64\Release\content\).
# Исходник в репозитории: PCG\content\ — копируется при сборке в выходную папку.
# Чтобы применить правки: пересоберите проект или правьте копию в bin\...\content\, затем перезапуск exe.
#
# TilingRepeats — множитель к UV (чаще повтор текстуры при большем значении).
TilingRepeats = 4

# По осям при необходимости:
# TilingRepeats_U = 2
# TilingRepeats_V = 2

# Движение текстур: true / false, 1 / 0, on / off
TextureMovement = true
